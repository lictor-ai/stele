name: Feature request
description: Something stele should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How stele could help. A command, a stele.md example or the output you'd expect is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
