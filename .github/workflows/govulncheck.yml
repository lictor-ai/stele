name: Go modules

# Checks the Go code and modules: govulncheck for known vulnerabilities that
# the code can reach (in the dependencies and in the Go toolchain go.mod
# pins), and go mod tidy for a go.mod and go.sum with nothing missing or
# unused. Linux only, and only when Go code, the modules or this workflow
# change: the paths filter keeps it from starting at all otherwise.
#
# govulncheck is pinned, as the actions are.
on:
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yml
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yml

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # setup-go installs the version of go.mod's toolchain line.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
